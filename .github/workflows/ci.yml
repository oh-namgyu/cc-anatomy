name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  unit:
    name: unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      # The only dependency is @playwright/test (dev). No browser download
      # here: the unit suite is pure data validation and never opens one.
      - run: npm ci
      - run: node --test "tests/*.test.mjs"

  e2e:
    name: e2e (chromium)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # playwright.config.mjs boots the static site with python3's stdlib
      # server — no build step, no app server of our own.
      - run: npx playwright test
